<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="仙冢 DreamBack 更新日志及项目开发记录。">
    <title>更新日志 — DreamBack 仙冢</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar-container"></div>
    <main class="container">
        <header>
            <h1>📅 更新日志</h1>
            <p class="subtitle">关注《仙冢》的发布信息与项目记录</p>
        </header>
        <section>
            <h2>📖 版本记录</h2>
            <div class="card">
                <strong>当前暂无正式版本日志</strong>
                <p>DreamBack 仓库尚未公开正式版本发布信息。此页面预留与《拔钉子》一致的内容布局，后续可以按版本补充更新说明。</p>
            </div>
        </section>
        <section>
            <h2>🔗 查看开发记录</h2>
            <div class="grid-2">
                <div class="card">
                    <strong>📦 代码提交</strong>
                    <p>查看项目仓库中的提交记录。</p>
                    <a href="https://github.com/NullLis/DreamBack/commits/main/">GitHub Commits</a>
                </div>
                <div class="card">
                    <strong>🏷️ 版本发布</strong>
                    <p>查看仓库发布页中的已公开版本。</p>
                    <a href="https://github.com/NullLis/DreamBack/releases">GitHub Releases</a>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-container"></div>
    <script src="../js/components.js"></script>
</body>
</html>
