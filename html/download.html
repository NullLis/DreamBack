<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="仙冢 DreamBack 客户端下载与发布信息。">
    <title>下载游戏 — DreamBack 仙冢</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar-container"></div>
    <main class="container">
        <header>
            <h1>📥 下载游戏</h1>
            <p class="subtitle">《仙冢》客户端与版本发布信息</p>
        </header>
        <section>
            <h2>🔄 最新发布</h2>
            <div style="max-width: 500px; margin: 0 auto;">
                <div class="card download-card">
                    <div class="icon-big">📦</div>
                    <h3>发布状态</h3>
                    <p>截至本次页面制作时，DreamBack 仓库尚无公开 Release。请以 GitHub 发布页的实时信息为准。</p>
                    <a href="https://github.com/NullLis/DreamBack/releases" class="btn btn-primary">查看 GitHub Releases</a>
                </div>
            </div>
        </section>
        <section>
            <h2>📱 游戏客户端</h2>
            <div class="grid-3">
                <div class="card download-card">
                    <div class="icon-big">🤖</div>
                    <h3>Android 版本</h3>
                    <p>尚未公布可供核实的安装包。</p>
                    <span class="btn btn-primary btn-disabled" aria-disabled="true">暂无下载</span>
                </div>
                <div class="card download-card">
                    <div class="icon-big">🍎</div>
                    <h3>iOS 版本</h3>
                    <p>尚未公布可供核实的安装包。</p>
                    <span class="btn btn-primary btn-disabled" aria-disabled="true">暂无下载</span>
                </div>
                <div class="card download-card">
                    <div class="icon-big">💻</div>
                    <h3>PC 版本</h3>
                    <p>尚未公布可供核实的安装包。</p>
                    <span class="btn btn-primary btn-disabled" aria-disabled="true">暂无下载</span>
                </div>
            </div>
        </section>
        <section>
            <h2>📂 其他资源</h2>
            <p>最新公开内容请前往 <a href="https://github.com/NullLis/DreamBack">DreamBack GitHub 仓库</a> 查看。</p>
        </section>
    </main>
    <div id="footer-container"></div>
    <script src="../js/components.js"></script>
</body>
</html>
